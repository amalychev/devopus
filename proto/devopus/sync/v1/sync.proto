// The link between agents and the workspace server (specs/agent-protocol.md). The agent
// opens it, outgoing, so it passes NAT and proxies; it signs in with its user's access
// token. The server sends the desired state, not commands: every message describes all
// the device should run, so a lost one breaks nothing.
syntax = "proto3";

package devopus.sync.v1;

import "devopus/workspace/v1/workspace.proto";
import "google/protobuf/timestamp.proto";

service SyncService {
  // Watch is the agent's connection: the device's desired state now, then again on
  // every change. The server closes it when the access token expires; the agent
  // reconnects with a fresh one. A member removed from the workspace is cut off.
  rpc Watch(WatchRequest) returns (stream WatchResponse) {
    option (devopus.workspace.v1.access) = {
      scope: SCOPE_WORKSPACE
      permission: "workspace.view"
    };
  }
  // ReportStatus tells the server what the device runs: every environment, features
  // created on the device included, and the version of the settings it applied.
  rpc ReportStatus(ReportStatusRequest) returns (ReportStatusResponse) {
    option (devopus.workspace.v1.access) = {
      scope: SCOPE_WORKSPACE
      permission: "workspace.view"
    };
  }
  // ListDevices shows devices and what they run: the admin sees all, a teamlead the
  // devices that run projects they manage, everyone their own.
  rpc ListDevices(ListDevicesRequest) returns (ListDevicesResponse) {
    option (devopus.workspace.v1.access) = {
      scope: SCOPE_WORKSPACE
      permission: "workspace.view"
    };
  }
}

message Device {
  // The device's random id (credentials.DeviceID).
  string id = 1;
  // Its host name.
  string name = 2;
  string agent_version = 3;
  // The device's public key for secrets: the workspace's key is wrapped for it.
  string public_key = 4;
}

message WatchRequest {
  string workspace_id = 1;
  Device device = 2;
}

// DesiredProject is a project the device runs, in the version the server has now.
message DesiredProject {
  string id = 1;
  string name = 2;
  int32 version = 3;
  // The project in the YAML form of internal/spec.
  string config_yaml = 4;
  // Its secrets encrypted to the workspace's key, by name: only to users who may read
  // them (secrets.read).
  map<string, bytes> secrets = 5;
  // What the user may change in devopus.yaml (spec.Allow*): * for admins and
  // teamleads, the project's overrides.allowed for developers.
  repeated string overrides_allowed = 6;
  // The user has overrides.use in the project; without it nothing is allowed.
  bool overrides_permitted = 7;
}

// SecretsKey is the workspace's key for this device.
message SecretsKey {
  int32 generation = 1;
  // The private key wrapped for this device; empty until a device that holds the key
  // delivers it.
  bytes wrapped = 2;
}

// PendingDevice is a device waiting for the workspace's key.
message PendingDevice {
  string device_id = 1;
  string user_id = 2;
  string user_email = 3;
  string device_name = 4;
  string public_key = 5;
}

// WatchResponse is the device's whole desired state in the workspace.
message WatchResponse {
  string workspace_id = 1;
  string workspace_name = 2;
  // Whom to ask for access to repositories.
  string admin_email = 3;
  // The projects of the workspace the user works in (env.use).
  repeated DesiredProject projects = 4;
  // Absent while the workspace has no key.
  SecretsKey key = 5;
  // Devices waiting for the key: sent to the devices of admins and teamleads, which
  // wrap it for them (ADR-0009, variant A).
  repeated PendingDevice pending_devices = 6;
}

message EnvironmentReport {
  string project = 1;
  // The environment's id on the device.
  string id = 2;
  // base or feature.
  string kind = 3;
  // A feature's name and branch.
  string name = 4;
  string branch = 5;
  // creating, running, sleeping, stopped, error…
  string phase = 6;
  string url = 7;
  string error = 8;
  // The version of the project's settings the device runs.
  int32 config_version = 9;
  // Personal overrides of devopus.yaml applied on the device, and the ones refused
  // with their reasons: the drift a teamlead sees.
  repeated string overrides = 10;
  repeated string rejected_overrides = 11;
}

message ReportStatusRequest {
  string workspace_id = 1;
  Device device = 2;
  repeated EnvironmentReport environments = 3;
}

message ReportStatusResponse {}

message ListDevicesRequest {
  string workspace_id = 1;
  // Only devices that run this project; empty: all.
  string project = 2;
}

message DeviceStatus {
  Device device = 1;
  string user_email = 2;
  google.protobuf.Timestamp last_seen = 3;
  // Seen in the last two minutes.
  bool online = 4;
  repeated EnvironmentReport environments = 5;
}

message ListDevicesResponse {
  repeated DeviceStatus devices = 1;
}
