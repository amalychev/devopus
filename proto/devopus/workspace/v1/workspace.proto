// The workspace server (ADR-0016): workspaces, members, roles, permissions, invites,
// projects and the audit log. Every call takes the user's access token from Auth
// ("Authorization: Bearer <token>") and declares the permission it needs (ADR-0015):
// one check for the CLI and the web interface.
syntax = "proto3";

package devopus.workspace.v1;

import "google/protobuf/descriptor.proto";
import "google/protobuf/timestamp.proto";

// Scope says where a call's permission is checked.
enum Scope {
  SCOPE_UNSPECIFIED = 0;
  // Any signed-in user: no workspace yet (create one, accept an invite).
  SCOPE_SIGNED_IN = 1;
  // In the request's workspace_id.
  SCOPE_WORKSPACE = 2;
  // In the request's project of workspace_id.
  SCOPE_PROJECT = 3;
}

// Access is what a call needs.
message Access {
  Scope scope = 1;
  // A permission of internal/authz: members.invite, project.create…
  string permission = 2;
}

extend google.protobuf.MethodOptions {
  Access access = 51000;
}

service WorkspaceService {
  // CreateWorkspace makes a workspace; its creator is its admin.
  rpc CreateWorkspace(CreateWorkspaceRequest) returns (CreateWorkspaceResponse) {
    option (access) = {scope: SCOPE_SIGNED_IN};
  }
  // ListWorkspaces lists the workspaces the user is a member of on this server.
  rpc ListWorkspaces(ListWorkspacesRequest) returns (ListWorkspacesResponse) {
    option (access) = {scope: SCOPE_SIGNED_IN};
  }
  // GetWorkspace describes a workspace and what the caller may do in it.
  rpc GetWorkspace(GetWorkspaceRequest) returns (GetWorkspaceResponse) {
    option (access) = {
      scope: SCOPE_WORKSPACE
      permission: "workspace.view"
    };
  }
  rpc RenameWorkspace(RenameWorkspaceRequest) returns (RenameWorkspaceResponse) {
    option (access) = {
      scope: SCOPE_WORKSPACE
      permission: "workspace.manage"
    };
  }
  // TransferWorkspace makes another member the admin; the old admin stays a teamlead.
  rpc TransferWorkspace(TransferWorkspaceRequest) returns (TransferWorkspaceResponse) {
    option (access) = {
      scope: SCOPE_WORKSPACE
      permission: "workspace.manage"
    };
  }
  // DeleteWorkspace removes a workspace with its projects, members and invites.
  rpc DeleteWorkspace(DeleteWorkspaceRequest) returns (DeleteWorkspaceResponse) {
    option (access) = {
      scope: SCOPE_WORKSPACE
      permission: "workspace.manage"
    };
  }
  // ListAudit is the workspace's log: who changed members, roles and permissions.
  rpc ListAudit(ListAuditRequest) returns (ListAuditResponse) {
    option (access) = {
      scope: SCOPE_WORKSPACE
      permission: "workspace.manage"
    };
  }

  // CreateProject adds a project; a teamlead who creates it leads it.
  rpc CreateProject(CreateProjectRequest) returns (CreateProjectResponse) {
    option (access) = {
      scope: SCOPE_WORKSPACE
      permission: "project.create"
    };
  }
  // ListProjects lists the workspace's projects with the caller's role in each.
  rpc ListProjects(ListProjectsRequest) returns (ListProjectsResponse) {
    option (access) = {
      scope: SCOPE_WORKSPACE
      permission: "workspace.view"
    };
  }
  // DeleteProject removes a project with its settings and roles: the admin or a
  // teamlead of the project; a granted project.configure is not enough.
  rpc DeleteProject(DeleteProjectRequest) returns (DeleteProjectResponse) {
    option (access) = {
      scope: SCOPE_PROJECT
      permission: "project.configure"
    };
  }

  // GetProjectConfig is a version of a project's settings: the current one by default.
  rpc GetProjectConfig(GetProjectConfigRequest) returns (GetProjectConfigResponse) {
    option (access) = {
      scope: SCOPE_PROJECT
      permission: "workspace.view"
    };
  }
  // ListProjectVersions is the history of a project's settings, newest first.
  rpc ListProjectVersions(ListProjectVersionsRequest) returns (ListProjectVersionsResponse) {
    option (access) = {
      scope: SCOPE_PROJECT
      permission: "workspace.view"
    };
  }
  // UpdateProjectSettings changes the domain and the policies of a project.
  rpc UpdateProjectSettings(UpdateProjectSettingsRequest) returns (UpdateProjectSettingsResponse) {
    option (access) = {
      scope: SCOPE_PROJECT
      permission: "project.configure"
    };
  }
  // RollbackProject makes an older version current again, as a new version.
  rpc RollbackProject(RollbackProjectRequest) returns (RollbackProjectResponse) {
    option (access) = {
      scope: SCOPE_PROJECT
      permission: "project.configure"
    };
  }
  // PutApp adds or replaces an application of a project.
  rpc PutApp(PutAppRequest) returns (PutAppResponse) {
    option (access) = {
      scope: SCOPE_PROJECT
      permission: "apps.manage"
    };
  }
  // RemoveApp removes an application; services attached to it are detached, which
  // needs services.manage too.
  rpc RemoveApp(RemoveAppRequest) returns (RemoveAppResponse) {
    option (access) = {
      scope: SCOPE_PROJECT
      permission: "apps.manage"
    };
  }
  // PutService adds or replaces a service of a project, with the applications it is
  // attached to.
  rpc PutService(PutServiceRequest) returns (PutServiceResponse) {
    option (access) = {
      scope: SCOPE_PROJECT
      permission: "services.manage"
    };
  }
  rpc RemoveService(RemoveServiceRequest) returns (RemoveServiceResponse) {
    option (access) = {
      scope: SCOPE_PROJECT
      permission: "services.manage"
    };
  }

  // Secrets are end-to-end (ADR-0009): the server keeps the workspace's public key,
  // its private key wrapped for each device, and ciphertexts. It reads no value.

  // GetSecretsKey is the workspace's current public key, and its private key wrapped
  // for one of the caller's devices if it has reached it.
  rpc GetSecretsKey(GetSecretsKeyRequest) returns (GetSecretsKeyResponse) {
    option (access) = {
      scope: SCOPE_WORKSPACE
      permission: "workspace.view"
    };
  }
  // RegisterDeviceKey records the public key of one of the caller's devices: the
  // workspace's key is wrapped for it.
  rpc RegisterDeviceKey(RegisterDeviceKeyRequest) returns (RegisterDeviceKeyResponse) {
    option (access) = {
      scope: SCOPE_WORKSPACE
      permission: "workspace.view"
    };
  }
  // CreateSecretsKey sets the workspace's first key, made on the admin's device.
  rpc CreateSecretsKey(CreateSecretsKeyRequest) returns (CreateSecretsKeyResponse) {
    option (access) = {
      scope: SCOPE_WORKSPACE
      permission: "workspace.manage"
    };
  }
  // ProvideKeyWraps delivers the workspace's key to devices waiting for it, wrapped
  // on a device that holds it: an admin's or a teamlead's.
  rpc ProvideKeyWraps(ProvideKeyWrapsRequest) returns (ProvideKeyWrapsResponse) {
    option (access) = {
      scope: SCOPE_WORKSPACE
      permission: "members.invite"
    };
  }
  // PrepareRotation gives the admin's device what a rotation re-encrypts: every
  // secret, sealed, and the devices that are to keep the key.
  rpc PrepareRotation(PrepareRotationRequest) returns (PrepareRotationResponse) {
    option (access) = {
      scope: SCOPE_WORKSPACE
      permission: "workspace.manage"
    };
  }
  // RotateSecretsKey replaces the key: every secret re-encrypted and the key wrapped
  // for the devices still in the workspace, all on the admin's device.
  rpc RotateSecretsKey(RotateSecretsKeyRequest) returns (RotateSecretsKeyResponse) {
    option (access) = {
      scope: SCOPE_WORKSPACE
      permission: "workspace.manage"
    };
  }
  // SetSecret stores a secret of a project, encrypted to the workspace's key.
  rpc SetSecret(SetSecretRequest) returns (SetSecretResponse) {
    option (access) = {
      scope: SCOPE_PROJECT
      permission: "secrets.manage"
    };
  }
  // ListSecrets names a project's secrets; values only agents decrypt.
  rpc ListSecrets(ListSecretsRequest) returns (ListSecretsResponse) {
    option (access) = {
      scope: SCOPE_PROJECT
      permission: "secrets.read"
    };
  }
  rpc RemoveSecret(RemoveSecretRequest) returns (RemoveSecretResponse) {
    option (access) = {
      scope: SCOPE_PROJECT
      permission: "secrets.manage"
    };
  }

  // CreateInvite invites an email with a role: the admin invites teamleads and
  // developers, a teamlead invites developers into the projects they lead.
  rpc CreateInvite(CreateInviteRequest) returns (CreateInviteResponse) {
    option (access) = {
      scope: SCOPE_WORKSPACE
      permission: "members.invite"
    };
  }
  // ListInvites lists open invites: all for the admin, their own for a teamlead.
  rpc ListInvites(ListInvitesRequest) returns (ListInvitesResponse) {
    option (access) = {
      scope: SCOPE_WORKSPACE
      permission: "members.invite"
    };
  }
  rpc RevokeInvite(RevokeInviteRequest) returns (RevokeInviteResponse) {
    option (access) = {
      scope: SCOPE_WORKSPACE
      permission: "members.invite"
    };
  }
  // AcceptInvite joins the workspace of an invite to the caller's email.
  rpc AcceptInvite(AcceptInviteRequest) returns (AcceptInviteResponse) {
    option (access) = {scope: SCOPE_SIGNED_IN};
  }

  rpc ListMembers(ListMembersRequest) returns (ListMembersResponse) {
    option (access) = {
      scope: SCOPE_WORKSPACE
      permission: "workspace.view"
    };
  }
  // GrantPermission gives a developer of a project a permission on top of the role.
  rpc GrantPermission(GrantPermissionRequest) returns (GrantPermissionResponse) {
    option (access) = {
      scope: SCOPE_PROJECT
      permission: "members.manage"
    };
  }
  rpc RevokePermission(RevokePermissionRequest) returns (RevokePermissionResponse) {
    option (access) = {
      scope: SCOPE_PROJECT
      permission: "members.manage"
    };
  }
  // RemoveFromProject takes a member out of a project: a teamlead removes developers.
  rpc RemoveFromProject(RemoveFromProjectRequest) returns (RemoveFromProjectResponse) {
    option (access) = {
      scope: SCOPE_PROJECT
      permission: "members.manage"
    };
  }
  // RemoveMember removes a member from the workspace; their access ends at once.
  rpc RemoveMember(RemoveMemberRequest) returns (RemoveMemberResponse) {
    option (access) = {
      scope: SCOPE_WORKSPACE
      permission: "members.manage"
    };
  }
}

message Workspace {
  string id = 1;
  string name = 2;
  string admin_email = 3;
  google.protobuf.Timestamp created_at = 4;
  // The caller's role in it: admin, teamlead or developer.
  string role = 5;
}

message Project {
  string id = 1;
  string name = 2;
  google.protobuf.Timestamp created_at = 3;
  // The caller's role in it; empty when they have none (the admin has all).
  string role = 4;
  // The current version of its settings.
  int32 version = 5;
}

// ProjectConfig is a version of a project's settings.
message ProjectConfig {
  int32 version = 1;
  // The project in its YAML form: name, domain, apps, services, policies.
  string yaml = 2;
  string author = 3;
  // What changed: "service set php 8.4", "rollback to 3"…
  string message = 4;
  google.protobuf.Timestamp created_at = 5;
}

message ProjectVersion {
  int32 version = 1;
  string author = 2;
  string message = 3;
  google.protobuf.Timestamp created_at = 4;
}

message ProjectRole {
  string project = 1;
  // teamlead or developer.
  string role = 2;
  // Permissions given on top of the role.
  repeated string grants = 3;
}

message Member {
  string user_id = 1;
  string email = 2;
  // In the workspace: admin, teamlead or developer.
  string role = 3;
  repeated ProjectRole projects = 4;
  google.protobuf.Timestamp joined_at = 5;
}

message Invite {
  string id = 1;
  string email = 2;
  string role = 3;
  repeated string projects = 4;
  string invited_by = 5;
  google.protobuf.Timestamp created_at = 6;
  google.protobuf.Timestamp expires_at = 7;
}

message AuditEvent {
  string actor = 1;
  // member.invited, member.joined, member.removed, permission.granted…
  string action = 2;
  string target = 3;
  string detail = 4;
  google.protobuf.Timestamp at = 5;
}

message CreateWorkspaceRequest {
  string name = 1;
}

message CreateWorkspaceResponse {
  Workspace workspace = 1;
}

message ListWorkspacesRequest {}

message ListWorkspacesResponse {
  repeated Workspace workspaces = 1;
}

message GetWorkspaceRequest {
  string workspace_id = 1;
}

message ProjectPermissions {
  string project = 1;
  repeated string permissions = 2;
}

message GetWorkspaceResponse {
  Workspace workspace = 1;
  // The caller's permissions in the workspace and in each project they have a role in.
  repeated string permissions = 2;
  repeated ProjectPermissions projects = 3;
}

message RenameWorkspaceRequest {
  string workspace_id = 1;
  string name = 2;
}

message RenameWorkspaceResponse {
  Workspace workspace = 1;
}

message TransferWorkspaceRequest {
  string workspace_id = 1;
  string email = 2;
}

message TransferWorkspaceResponse {}

message DeleteWorkspaceRequest {
  string workspace_id = 1;
  // Must repeat the workspace's name.
  string confirm_name = 2;
}

message DeleteWorkspaceResponse {}

message ListAuditRequest {
  string workspace_id = 1;
  int32 limit = 2;
}

message ListAuditResponse {
  repeated AuditEvent events = 1;
}

message CreateProjectRequest {
  string workspace_id = 1;
  string name = 2;
  // The domain of its environments; <name>.localhost by default.
  string domain = 3;
  // The first version of its settings in YAML (an import of docker-compose.yml);
  // empty: no applications and services yet. Its name and domain are replaced.
  string config_yaml = 4;
}

message CreateProjectResponse {
  Project project = 1;
  ProjectConfig config = 2;
}

message DeleteProjectRequest {
  string workspace_id = 1;
  string project = 2;
  // Must repeat the project's name.
  string confirm_name = 3;
}

message DeleteProjectResponse {}

message GetProjectConfigRequest {
  string workspace_id = 1;
  string project = 2;
  // 0: the current one.
  int32 version = 3;
}

message GetProjectConfigResponse {
  ProjectConfig config = 1;
  // The current version, to compare with the one asked for.
  int32 current_version = 2;
}

message ListProjectVersionsRequest {
  string workspace_id = 1;
  string project = 2;
  int32 limit = 3;
}

message ListProjectVersionsResponse {
  repeated ProjectVersion versions = 1;
}

// Changes take the version they were made against: if the settings changed since,
// the change is refused (ABORTED) instead of overwriting someone else's; 0 skips
// the check.
message UpdateProjectSettingsRequest {
  string workspace_id = 1;
  string project = 2;
  int32 base_version = 3;
  // Empty keeps the domain.
  string domain = 4;
  // YAML with features, overrides and data: the policies it names are replaced.
  string policy_yaml = 5;
}

message UpdateProjectSettingsResponse {
  ProjectConfig config = 1;
}

message RollbackProjectRequest {
  string workspace_id = 1;
  string project = 2;
  int32 version = 3;
}

message RollbackProjectResponse {
  ProjectConfig config = 1;
}

message PutAppRequest {
  string workspace_id = 1;
  string project = 2;
  int32 base_version = 3;
  string name = 4;
  // The application in YAML: repo, path, branch, routes, port, env, hooks…
  string app_yaml = 5;
  // Add: refuse if it exists. Otherwise replace: refuse if it does not.
  bool create = 6;
}

message PutAppResponse {
  ProjectConfig config = 1;
}

message RemoveAppRequest {
  string workspace_id = 1;
  string project = 2;
  int32 base_version = 3;
  string name = 4;
}

message RemoveAppResponse {
  ProjectConfig config = 1;
}

message PutServiceRequest {
  string workspace_id = 1;
  string project = 2;
  int32 base_version = 3;
  string name = 4;
  // The service in YAML: type, version, apps, port, env…
  string service_yaml = 5;
  bool create = 6;
}

message PutServiceResponse {
  ProjectConfig config = 1;
}

message RemoveServiceRequest {
  string workspace_id = 1;
  string project = 2;
  int32 base_version = 3;
  string name = 4;
}

message RemoveServiceResponse {
  ProjectConfig config = 1;
}

message ListProjectsRequest {
  string workspace_id = 1;
}

message ListProjectsResponse {
  repeated Project projects = 1;
}

message CreateInviteRequest {
  string workspace_id = 1;
  string email = 2;
  // teamlead or developer.
  string role = 3;
  // Projects the invitee gets the role in.
  repeated string projects = 4;
}

message CreateInviteResponse {
  Invite invite = 1;
  // The code the invitee accepts with; shown once.
  string code = 2;
}

message ListInvitesRequest {
  string workspace_id = 1;
}

message ListInvitesResponse {
  repeated Invite invites = 1;
}

message RevokeInviteRequest {
  string workspace_id = 1;
  string invite_id = 2;
}

message RevokeInviteResponse {}

message AcceptInviteRequest {
  string code = 1;
}

message AcceptInviteResponse {
  Workspace workspace = 1;
}

message ListMembersRequest {
  string workspace_id = 1;
}

message ListMembersResponse {
  repeated Member members = 1;
}

message GrantPermissionRequest {
  string workspace_id = 1;
  string project = 2;
  string email = 3;
  string permission = 4;
}

message GrantPermissionResponse {}

message RevokePermissionRequest {
  string workspace_id = 1;
  string project = 2;
  string email = 3;
  string permission = 4;
}

message RevokePermissionResponse {}

message RemoveFromProjectRequest {
  string workspace_id = 1;
  string project = 2;
  string email = 3;
}

message RemoveFromProjectResponse {}

message RemoveMemberRequest {
  string workspace_id = 1;
  string email = 2;
}

message RemoveMemberResponse {}

message GetSecretsKeyRequest {
  string workspace_id = 1;
  // The device whose wrapped key to return.
  string device_id = 2;
}

message GetSecretsKeyResponse {
  // 0: the workspace has no key yet.
  int32 generation = 1;
  // age1…
  string public_key = 2;
  // The private key wrapped for the device; empty until it reaches the device.
  bytes wrapped = 3;
}

message RegisterDeviceKeyRequest {
  string workspace_id = 1;
  string device_id = 2;
  string device_name = 3;
  string public_key = 4;
}

message RegisterDeviceKeyResponse {}

message CreateSecretsKeyRequest {
  string workspace_id = 1;
  string public_key = 2;
  // The key wrapped for the admin's device, which made it.
  string device_id = 3;
  bytes wrapped = 4;
}

message CreateSecretsKeyResponse {
  int32 generation = 1;
}

message KeyWrap {
  string device_id = 1;
  string user_id = 2;
  bytes wrapped = 3;
}

message ProvideKeyWrapsRequest {
  string workspace_id = 1;
  int32 generation = 2;
  repeated KeyWrap wraps = 3;
}

message ProvideKeyWrapsResponse {
  int32 delivered = 1;
}

message SealedSecret {
  string project = 1;
  string name = 2;
  bytes ciphertext = 3;
}

message RotateSecretsKeyRequest {
  string workspace_id = 1;
  // The generation being replaced: the rotation is refused if it is not current.
  int32 from_generation = 2;
  string public_key = 3;
  // For every device of the workspace that is to keep the key.
  repeated KeyWrap wraps = 4;
  // Every secret of the workspace, re-encrypted to the new key.
  repeated SealedSecret secrets = 5;
}

message RotateSecretsKeyResponse {
  int32 generation = 1;
}

message SetSecretRequest {
  string workspace_id = 1;
  string project = 2;
  string name = 3;
  // The key generation it is encrypted to: it must be the current one.
  int32 generation = 4;
  bytes ciphertext = 5;
}

message SetSecretResponse {}

message SecretInfo {
  string name = 1;
  string updated_by = 2;
  google.protobuf.Timestamp updated_at = 3;
}

message ListSecretsRequest {
  string workspace_id = 1;
  string project = 2;
}

message ListSecretsResponse {
  repeated SecretInfo secrets = 1;
}

message RemoveSecretRequest {
  string workspace_id = 1;
  string project = 2;
  string name = 3;
}

message RemoveSecretResponse {}

message PrepareRotationRequest {
  string workspace_id = 1;
}

message DeviceKey {
  string device_id = 1;
  string user_id = 2;
  string user_email = 3;
  string device_name = 4;
  string public_key = 5;
}

message PrepareRotationResponse {
  int32 generation = 1;
  repeated SealedSecret secrets = 2;
  repeated DeviceKey devices = 3;
}
