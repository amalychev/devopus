// Local API of the Devopus agent (stage 1). The CLI and the local panel talk to the
// agent over a unix socket. DesiredState and EnvironmentStatus are the messages of
// specs/agent-protocol.md: the cloud link of stage 2 reuses them (ADR-0001).
syntax = "proto3";

package devopus.agent.v2;

import "google/protobuf/timestamp.proto";

service AgentService {
  // Status reports the agent, the container runtime and every environment.
  rpc Status(StatusRequest) returns (StatusResponse);
  // Up registers a project from its workspace.yaml and wants its base environment running.
  rpc Up(UpRequest) returns (UpResponse);
  // Down stops the base environment of a project, or removes the project with purge.
  rpc Down(DownRequest) returns (DownResponse);
  // Watch streams environment status: the current status first, then every change.
  rpc Watch(WatchRequest) returns (stream WatchResponse);
  // Routes is the proxy's routing table.
  rpc Routes(RoutesRequest) returns (RoutesResponse);
  // SetProxy changes the device's proxy settings: coexistence with a dev server, restart.
  rpc SetProxy(SetProxyRequest) returns (SetProxyResponse);
  // CreateFeature adds a feature environment that forks some applications of a project.
  rpc CreateFeature(CreateFeatureRequest) returns (CreateFeatureResponse);
  // AddFeatureApps forks more applications in an existing feature.
  rpc AddFeatureApps(AddFeatureAppsRequest) returns (AddFeatureAppsResponse);
  // RemoveFeature removes a feature with its containers, data and worktrees. Without
  // force it refuses while a worktree has work that exists nowhere else.
  rpc RemoveFeature(RemoveFeatureRequest) returns (RemoveFeatureResponse);
  // ResetData recreates a feature's databases from the golden copies, or refreshes the
  // golden copies of the base environment.
  rpc ResetData(ResetDataRequest) returns (ResetDataResponse);
  // SetSleep puts a feature to sleep or wakes it up.
  rpc SetSleep(SetSleepRequest) returns (SetSleepResponse);
  // DescribeProject reads a registered project's workspace.yaml from its folder: what
  // the panel offers to fork, and what a feature that forks the given applications gets.
  rpc DescribeProject(DescribeProjectRequest) returns (DescribeProjectResponse);
  rpc LogSources(LogSourcesRequest) returns (LogSourcesResponse);
  rpc Logs(LogsRequest) returns (stream LogsResponse);
  rpc Resources(ResourcesRequest) returns (ResourcesResponse);
  // ReviewChanges accepts or declines the version of a server project that waits for
  // the user (ProjectSpec.pending).
  rpc ReviewChanges(ReviewChangesRequest) returns (ReviewChangesResponse);
  // ExpectChange tells the agent what its user is changing in a server project, so
  // that the version with it is applied without asking them.
  rpc ExpectChange(ExpectChangeRequest) returns (ExpectChangeResponse);
}

message ReviewChangesRequest {
  string project = 1;
  // The pending version's hash, as the user saw it: a newer version is not accepted
  // in its place.
  string hash = 2;
  bool accept = 3;
}

message ReviewChangesResponse {
  uint64 desired_revision = 1;
}

message ExpectChangeRequest {
  string project = 1;
  // apps.<name> or services.<name>.
  string section = 2;
  // The section in YAML as the user sent it to the server; empty: removed.
  bytes yaml = 3;
}

message ExpectChangeResponse {}

// DesiredState is what must exist on this device. Revision grows with every change.
message DesiredState {
  uint64 revision = 1;
  repeated ProjectSpec projects = 2;
  repeated EnvironmentSpec environments = 3;
  DeviceSettings device = 4;
  // The root of trust of each workspace, pinned the first time the agent saw it
  // (ADR-0018): the server cannot replace it.
  map<string, TrustRoot> trust_roots = 5;
}

message TrustRoot {
  bytes public_key = 1;
  string device_id = 2;
  string email = 3;
  // The server gives another root than the pinned one: signatures do not count until
  // the user looks into it.
  bytes offered = 4;
}

// DeviceSettings are per device, not per project.
message DeviceSettings {
  // Coexistence (local-networking.md §1): a dev server moved off 80/443 to these host
  // ports gets every host Devopus does not serve. 0: off.
  uint32 coexist_http_port = 1;
  uint32 coexist_https_port = 2;
  // Bumping it recreates the proxy container, which probes the ports again.
  uint64 proxy_generation = 3;
}

message ProjectSpec {
  // Name from workspace.yaml or the workspace server; unique on the device.
  string name = 1;
  // Repository root: the folder of workspace.yaml. For a project from the workspace
  // server: the folder its path applications live in (devopus up --dir), or a folder
  // of the agent's own.
  string root = 2;
  // workspace.yaml as it was when the project was applied; empty for a project from
  // the workspace server, which has spec instead.
  bytes config = 3;
  // sha256 of config or spec, hex.
  string config_hash = 4;
  // A project from the workspace server (R7): the workspace it belongs to.
  string workspace_id = 5;
  // The project in the YAML form of internal/spec, as the server sent it.
  bytes spec = 6;
  // The version of the project's settings on the server.
  int32 config_version = 7;
  // The workspace's admin: whom to ask for access to repositories.
  string admin_email = 8;
  // The server no longer gives this project to this device: removed, access ended,
  // or another workspace is current. Its environments are stopped, data kept.
  bool orphaned = 9;
  // Stopped on this device with devopus down: the server's changes do not start it.
  bool held = 10;
  // Its secrets encrypted to the workspace's key, by name (ADR-0009).
  map<string, bytes> secrets = 11;
  // The workspace's key wrapped for this device; empty until it is delivered.
  bytes key_wrap = 12;
  int32 key_generation = 13;
  // What devopus.yaml may change for this user (spec.Allow*), and whether they have
  // overrides.use at all.
  repeated string overrides_allowed = 14;
  bool overrides_permitted = 15;
  // A version from the server with risky changes — a new image outside the catalog,
  // commands, hooks, builds, host folders, another repository (risk R21) — waits for
  // the user: the project keeps running config_version until they accept it.
  PendingChange pending = 16;
  // What this device's user just changed themselves (devopus app/service set), by
  // section ("apps.api"): a version whose risky changes are these is theirs, and is
  // applied without asking. Cleared when a version is applied.
  map<string, bytes> expected = 17;
  // sha256 of a version the user declined: it is not asked about again.
  string declined = 18;
  // Who signed the version the project runs, checked against the pinned root; empty:
  // unsigned or not trusted.
  string signed_by = 19;
  // On an admin's server (R14, ADR-0020): the environment it runs the project as, its
  // public domain and who signed it. Empty: the project's own (local) domain.
  string env_kind = 20;
  string public_domain = 21;
  string environment_signed_by = 22;
}

message PendingChange {
  int32 version = 1;
  bytes spec = 2;
  // sha256 of spec, hex: what ReviewChanges accepts.
  string hash = 3;
  // The risky changes, then the rest.
  repeated string risky = 4;
  repeated string other = 5;
  // Why its signature does not count: unsigned, an uncertified device…
  string unverified = 6;
}

enum EnvironmentKind {
  ENVIRONMENT_KIND_UNSPECIFIED = 0;
  ENVIRONMENT_KIND_BASE = 1;
  ENVIRONMENT_KIND_FEATURE = 2;
}

enum DesiredPhase {
  DESIRED_PHASE_UNSPECIFIED = 0;
  DESIRED_PHASE_RUNNING = 1;
  // Containers stopped, data and network kept.
  DESIRED_PHASE_STOPPED = 2;
}

message EnvironmentSpec {
  // Stable ID used in every Docker resource; never derived from a branch name.
  string id = 1;
  string project = 2;
  EnvironmentKind kind = 3;
  // Only in URLs.
  string slug = 4;
  string branch = 5;
  repeated string forked_apps = 6;
  DesiredPhase phase = 7;
  // The feature's name as people typed it (PAY-123); the slug is derived from it.
  string name = 8;
  // Bumping a service's number recreates the feature's copy of its data from the golden
  // copy; in the base environment it refreshes the golden copy.
  map<string, uint64> data_resets = 9;
}

enum Phase {
  PHASE_UNSPECIFIED = 0;
  PHASE_CREATING = 1;
  PHASE_RUNNING = 2;
  PHASE_STOPPED = 3;
  PHASE_ERROR = 4;
  PHASE_DELETING = 5;
  // A feature with its containers stopped; its first request wakes it.
  PHASE_SLEEPING = 6;
}

enum StepState {
  STEP_STATE_UNSPECIFIED = 0;
  STEP_STATE_PENDING = 1;
  STEP_STATE_RUNNING = 2;
  STEP_STATE_DONE = 3;
  STEP_STATE_FAILED = 4;
}

message StepProgress {
  string name = 1;
  StepState state = 2;
  string message = 3;
  google.protobuf.Timestamp started_at = 4;
  google.protobuf.Timestamp finished_at = 5;
}

message NetworkStatus {
  string name = 1;
  string subnet = 2;
}

message EnvironmentStatus {
  string id = 1;
  string project = 2;
  EnvironmentKind kind = 3;
  string slug = 4;
  Phase phase = 5;
  repeated StepProgress steps = 6;
  string url = 7;
  string error = 8;
  NetworkStatus network = 9;
  // Revision of the desired state this status reflects.
  uint64 applied_revision = 10;
  google.protobuf.Timestamp updated_at = 11;
  // The environment left the desired state and its resources are gone.
  bool removed = 12;
  // Services, applications and workers of the environment.
  repeated UnitStatus units = 13;
  // Features: the name, the branch and the forked applications from the desired state.
  string name = 14;
  string branch = 15;
  repeated string forked_apps = 16;
  // Where the code of each application of the environment is on the host.
  repeated AppSource sources = 17;
  // Applications and services a feature takes from the base environment.
  repeated string shared = 18;
  // Notes for people: migrations skipped on shared data and the like.
  repeated string notes = 19;
  // The project's folder in the feature's worktree of its repository; empty when the
  // feature's applications all come from other repositories.
  string code_root = 20;
  // Databases: golden copies in the base environment, their copies in a feature.
  repeated DataStatus data = 21;
  // Features: when they were last in use, why and since when they sleep.
  google.protobuf.Timestamp last_active = 22;
  string sleep_reason = 23;
  google.protobuf.Timestamp sleeping_since = 24;
  // The feature's branch is merged into the base branch (cleanup: on_merge).
  bool merged = 25;
}

message DataStatus {
  string service = 1;
  // postgres or mysql.
  string engine = 2;
  // When the golden copy (base) or the feature's copy was made.
  google.protobuf.Timestamp copied_at = 3;
  // The feature's copy comes from an older golden copy: main migrated since.
  bool behind = 4;
  // Size of the copy, human-readable.
  string size = 5;
  string note = 6;
}

message AppSource {
  string app = 1;
  // The application's folder.
  string path = 2;
  // The checkout it belongs to: a clone, a worktree or the project's repository.
  string checkout = 3;
  // Branch checked out there; empty when detached at the base branch's commit.
  string branch = 4;
}

// UnitStatus is one container of an environment.
message UnitStatus {
  // Name in the environment: mysql, api, api-worker-1.
  string name = 1;
  // service, app or worker.
  string role = 2;
  string container = 3;
  // running, starting (running, not healthy yet), exited, stopped, missing.
  string state = 4;
  // Pinned address and port in the environment network; empty for workers.
  string address = 5;
  // Path prefixes (applications) or the host of the web UI (services with expose).
  repeated string routes = 6;
  // Why the unit is not running, with the end of its output.
  string error = 7;
}

message RuntimeInfo {
  // docker-desktop, orbstack, colima, podman, docker-engine or unknown.
  string name = 1;
  string endpoint = 2;
  string server_version = 3;
  string os = 4;
  bool reachable = 5;
  string error = 6;
}

message StatusRequest {}

message StatusResponse {
  string agent_version = 1;
  uint64 desired_revision = 2;
  RuntimeInfo runtime = 3;
  repeated ProjectSpec projects = 4;
  repeated EnvironmentStatus environments = 5;
  ProxyStatus proxy = 6;
  CAInfo ca = 7;
  // Was the local panel's address: the panel is its own process now (`devopus panel`).
  reserved 8;
  reserved "panel_url";
  // Who the agent works for: the user signed in on this device. Absent when nobody is.
  AccountInfo account = 9;
  // The link to the workspace server the projects come from.
  LinkInfo link = 10;
}

message LinkInfo {
  string workspace = 1;
  string server = 2;
  bool connected = 3;
  // Why it is not connected.
  string error = 4;
}

message AccountInfo {
  string email = 1;
  string user_id = 2;
  string session_id = 3;
  // The Auth service the session belongs to.
  string auth_url = 4;
}

message PortConflict {
  // 127.0.0.1:80, [::1]:443…
  string address = 1;
  string owner = 2;
  int32 pid = 3;
  // A dev server that can coexist (nginx, Laravel Herd…) or "runtime".
  string kind = 4;
  string hint = 5;
}

message ProxyStatus {
  // absent (no environments), starting, running, error.
  string state = 1;
  // default, coexist or fallback.
  string mode = 2;
  uint32 http_port = 3;
  uint32 https_port = 4;
  string error = 5;
  // Why the proxy is not on 80/443, or why it cannot start.
  repeated PortConflict conflicts = 6;
  // Envoy holds the xDS stream.
  bool connected = 7;
  string config_version = 8;
  // Envoy's last rejection of the configuration, if any.
  string rejected = 9;
  string container = 10;
  uint32 coexist_http_port = 11;
  uint32 coexist_https_port = 12;
  // Loopback addresses the agent relays itself because the runtime does not publish
  // them (Colima: [::1] for ports above 1024).
  repeated string relays = 13;
}

message CAInfo {
  // The root certificate people add to their trust stores.
  string root_path = 1;
  // SHA-256 of the root, as keychains show it.
  string fingerprint = 2;
  google.protobuf.Timestamp not_after = 3;
}

message Route {
  string host = 1;
  string environment_id = 2;
  string project = 3;
  // Path prefix; "/" for everything.
  string path = 4;
  // What serves it: an application or service with its address, or a page of the proxy.
  string target = 5;
  string url = 6;
}

message RoutesRequest {
  // Empty: every environment.
  string environment_id = 1;
}

message RoutesResponse {
  repeated Route routes = 1;
  ProxyStatus proxy = 2;
}

message SetProxyRequest {
  // 0 turns coexistence off.
  uint32 coexist_http_port = 1;
  uint32 coexist_https_port = 2;
  // Recreate the proxy container: it probes 80/443 again. Changing coexistence
  // restarts it too, since that is when 80/443 become free.
  bool restart = 3;
}

message SetProxyResponse {
  uint64 revision = 1;
}

message UpRequest {
  // Were workspace.yaml and its path: projects come from the workspace server (R10).
  reserved 1, 2;
  reserved "workspace_path", "config";
  // A project the agent has: from the workspace server, or registered from a folder
  // before R10.
  string project = 3;
  // A project from the workspace server: the folder of its path applications.
  string dir = 4;
}

message UpResponse {
  string environment_id = 1;
  uint64 revision = 2;
}

message DownRequest {
  string project = 1;
  // Remove the project and everything it owns, data included.
  bool purge = 2;
}

message DownResponse {
  uint64 revision = 1;
}

message WatchRequest {
  // Empty: every environment.
  string environment_id = 1;
}

message WatchResponse {
  EnvironmentStatus status = 1;
  // Sent once, after the current statuses: from here on every change is delivered.
  // A client that changes the desired state waits for it to not miss progress.
  bool synced = 2;
}

message CreateFeatureRequest {
  reserved 1, 2;
  reserved "workspace_path", "config";
  string name = 3;
  repeated string apps = 4;
  // Default: features.branch_prefix + name.
  string branch = 5;
  string project = 6;
}

message CreateFeatureResponse {
  string environment_id = 1;
  string slug = 2;
  string branch = 3;
  uint64 revision = 4;
  string base_environment_id = 5;
}

message AddFeatureAppsRequest {
  reserved 1, 2;
  reserved "workspace_path", "config";
  // Name, slug or ID of the feature.
  string feature = 3;
  repeated string apps = 4;
  string project = 5;
}

message AddFeatureAppsResponse {
  string environment_id = 1;
  uint64 revision = 2;
}

message RemoveFeatureRequest {
  string project = 1;
  // Name, slug or ID of the feature.
  string feature = 2;
  // Remove even with uncommitted or unpushed work in its worktrees.
  bool force = 3;
}

message RemoveFeatureResponse {
  string environment_id = 1;
  uint64 revision = 2;
}

message ResetDataRequest {
  string project = 1;
  // Name, slug or ID of a feature; empty for the base environment's golden copies.
  string environment = 2;
  // Empty: every database of the environment.
  repeated string services = 3;
}

message ResetDataResponse {
  string environment_id = 1;
  uint64 revision = 2;
  repeated string services = 3;
}

message SetSleepRequest {
  string project = 1;
  // Name, slug or ID of the feature.
  string feature = 2;
  bool asleep = 3;
}

message SetSleepResponse {
  string environment_id = 1;
}

message DescribeProjectRequest {
  string project = 1;
  // forks, if any, plans a feature that forks these applications.
  repeated string forks = 2;
}

message AppInfo {
  string name = 1;
  repeated string routes = 2;
  bool optional = 3;
  repeated string uses = 4;
}

message FeaturePlan {
  repeated string forked = 1;
  // dependents use forked applications and run in the feature on the base branch.
  repeated string dependents = 2;
  // copies are databases that start as a copy of main's data.
  repeated string copies = 3;
  // own are services the feature runs empty.
  repeated string own = 4;
  repeated string shared = 5;
  repeated string warnings = 6;
}

message DescribeProjectResponse {
  string project = 1;
  string workspace_path = 2;
  string domain = 3;
  repeated AppInfo apps = 4;
  repeated string services = 5;
  string branch_prefix = 6;
  FeaturePlan plan = 7;
  // The project as the agent runs it, in the YAML form of internal/spec: with the
  // personal overrides of devopus.yaml applied.
  bytes spec = 8;
  // devopus.yaml: where it is, what it changed, what it could not.
  string override_file = 9;
  repeated string overrides_applied = 10;
  repeated string overrides_rejected = 11;
}

message LogSource {
  // unit is an application, worker or service; file is a hook or build log of the environment.
  string unit = 1;
  string file = 2;
  google.protobuf.Timestamp updated_at = 3;
}

message LogSourcesRequest {
  string environment_id = 1;
}

message LogSourcesResponse {
  repeated LogSource sources = 1;
}

message LogsRequest {
  string environment_id = 1;
  LogSource source = 2;
  // tail is how many last lines to send first; 0 sends them all.
  uint32 tail = 3;
  bool follow = 4;
}

message LogLine {
  string text = 1;
  bool stderr = 2;
  google.protobuf.Timestamp time = 3;
}

message LogsResponse {
  repeated LogLine lines = 1;
}

message ResourcesRequest {
  string environment_id = 1;
}

message UnitResources {
  string name = 1;
  double cpu_percent = 2;
  uint64 memory_bytes = 3;
  uint64 memory_limit = 4;
}

message ResourcesResponse {
  repeated UnitResources units = 1;
}
