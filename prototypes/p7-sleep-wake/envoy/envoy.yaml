# P-7: one static config that never changes. A feature route points at an aggregate
# cluster [feature module, waker]: while the module is healthy it gets the traffic; while it
# sleeps (stopped container, failed health check) Envoy fails over to the waker.
admin:
  address: { socket_address: { address: 0.0.0.0, port_value: 9901 } }
static_resources:
  listeners:
  - name: edge
    address: { socket_address: { address: 0.0.0.0, port_value: 8080 } }
    filter_chains:
    - filters:
      - name: envoy.filters.network.http_connection_manager
        typed_config:
          "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
          stat_prefix: edge
          http_filters:
          - name: envoy.filters.http.router
            typed_config: { "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router }
          route_config:
            name: edge
            virtual_hosts:
            - name: main
              domains: ["shop.localhost", "shop.localhost:*"]
              routes:
              - { match: { prefix: / }, route: { cluster: backend-main } }
            - name: pay-1
              domains: ["pay-1.shop.localhost", "pay-1.shop.localhost:*"]
              # Tells the waker where to send a held request once the module is up, so the
              # replay does not depend on how fast every Envoy worker sees the host healthy.
              request_headers_to_add:
              - header: { key: x-devcorb-upstream, value: "172.30.0.21:80" }
                append_action: OVERWRITE_IF_EXISTS_OR_ADD
              routes:
              - match: { prefix: / }
                route:
                  cluster: agg-pay-1
                  timeout: 70s      # the waker may hold a request while the feature starts
                  retry_policy:
                    retry_on: connect-failure,reset
                    num_retries: 3
                    retry_back_off: { base_interval: 0.1s }
                    # Skip a host that already failed (e.g. the old IP of a restarted container).
                    retry_host_predicate: [{ name: envoy.retry_host_predicates.previous_hosts, typed_config: { "@type": type.googleapis.com/envoy.extensions.retry.host.previous_hosts.v3.PreviousHostsPredicate } }]
                    host_selection_retry_max_attempts: 3
            - name: ui-2
              domains: ["ui-2.shop.localhost", "ui-2.shop.localhost:*"]
              # Tells the waker where to send a held request once the module is up, so the
              # replay does not depend on how fast every Envoy worker sees the host healthy.
              request_headers_to_add:
              - header: { key: x-devcorb-upstream, value: "172.30.0.22:80" }
                append_action: OVERWRITE_IF_EXISTS_OR_ADD
              routes:
              - match: { prefix: / }
                route:
                  cluster: agg-ui-2
                  timeout: 70s      # the waker may hold a request while the feature starts
                  retry_policy:
                    retry_on: connect-failure,reset
                    num_retries: 3
                    retry_back_off: { base_interval: 0.1s }
                    # Skip a host that already failed (e.g. the old IP of a restarted container).
                    retry_host_predicate: [{ name: envoy.retry_host_predicates.previous_hosts, typed_config: { "@type": type.googleapis.com/envoy.extensions.retry.host.previous_hosts.v3.PreviousHostsPredicate } }]
                    host_selection_retry_max_attempts: 3
            - name: slow-3
              domains: ["slow-3.shop.localhost", "slow-3.shop.localhost:*"]
              # Tells the waker where to send a held request once the module is up, so the
              # replay does not depend on how fast every Envoy worker sees the host healthy.
              request_headers_to_add:
              - header: { key: x-devcorb-upstream, value: "172.30.0.23:80" }
                append_action: OVERWRITE_IF_EXISTS_OR_ADD
              routes:
              - match: { prefix: / }
                route:
                  cluster: agg-slow-3
                  timeout: 70s      # the waker may hold a request while the feature starts
                  retry_policy:
                    retry_on: connect-failure,reset
                    num_retries: 3
                    retry_back_off: { base_interval: 0.1s }
                    # Skip a host that already failed (e.g. the old IP of a restarted container).
                    retry_host_predicate: [{ name: envoy.retry_host_predicates.previous_hosts, typed_config: { "@type": type.googleapis.com/envoy.extensions.retry.host.previous_hosts.v3.PreviousHostsPredicate } }]
                    host_selection_retry_max_attempts: 3
  clusters:
  - name: backend-main
    type: STRICT_DNS
    connect_timeout: 1s
    dns_lookup_family: V4_ONLY
    dns_refresh_rate: 1s
    load_assignment:
      cluster_name: backend-main
      endpoints: [{ lb_endpoints: [{ endpoint: { address: { socket_address: { address: p7-backend, port_value: 80 } } } }] }]
  - name: waker
    type: STRICT_DNS
    connect_timeout: 1s
    dns_lookup_family: V4_ONLY
    dns_refresh_rate: 1s
    load_assignment:
      cluster_name: waker
      endpoints: [{ lb_endpoints: [{ endpoint: { address: { socket_address: { address: p7-waker, port_value: 8000 } } } }] }]
  - name: pay-1-payments
    type: STATIC
    connect_timeout: 0.25s   # a live local container accepts at once
    load_assignment:
      cluster_name: pay-1-payments
      endpoints:
      - lb_endpoints:
        - endpoint:
            address: { socket_address: { address: 172.30.0.21, port_value: 80 } }
            # Health is the agent's call, not a guess from a TCP probe: the waker answers
            # for the env, and turns it unhealthy before it stops the containers.
            health_check_config:
              address: { socket_address: { address: 172.30.0.10, port_value: 8000 } }
    health_checks:
    - timeout: 0.5s
      interval: 0.5s
      no_traffic_interval: 0.5s   # default 60s is far too slow for a cluster without traffic
      unhealthy_threshold: 1
      healthy_threshold: 1
      http_health_check: { path: /_waker/health/pay-1 }
    common_lb_config:
      healthy_panic_threshold: { value: 0 }   # never send traffic to an unhealthy env
  - name: ui-2-frontend
    type: STATIC
    connect_timeout: 0.25s   # a live local container accepts at once
    load_assignment:
      cluster_name: ui-2-frontend
      endpoints:
      - lb_endpoints:
        - endpoint:
            address: { socket_address: { address: 172.30.0.22, port_value: 80 } }
            # Health is the agent's call, not a guess from a TCP probe: the waker answers
            # for the env, and turns it unhealthy before it stops the containers.
            health_check_config:
              address: { socket_address: { address: 172.30.0.10, port_value: 8000 } }
    health_checks:
    - timeout: 0.5s
      interval: 0.5s
      no_traffic_interval: 0.5s   # default 60s is far too slow for a cluster without traffic
      unhealthy_threshold: 1
      healthy_threshold: 1
      http_health_check: { path: /_waker/health/ui-2 }
    common_lb_config:
      healthy_panic_threshold: { value: 0 }   # never send traffic to an unhealthy env
  - name: slow-3-app
    type: STATIC
    connect_timeout: 0.25s   # a live local container accepts at once
    load_assignment:
      cluster_name: slow-3-app
      endpoints:
      - lb_endpoints:
        - endpoint:
            address: { socket_address: { address: 172.30.0.23, port_value: 80 } }
            # Health is the agent's call, not a guess from a TCP probe: the waker answers
            # for the env, and turns it unhealthy before it stops the containers.
            health_check_config:
              address: { socket_address: { address: 172.30.0.10, port_value: 8000 } }
    health_checks:
    - timeout: 0.5s
      interval: 0.5s
      no_traffic_interval: 0.5s   # default 60s is far too slow for a cluster without traffic
      unhealthy_threshold: 1
      healthy_threshold: 1
      http_health_check: { path: /_waker/health/slow-3 }
    common_lb_config:
      healthy_panic_threshold: { value: 0 }   # never send traffic to an unhealthy env
  - name: agg-pay-1
    connect_timeout: 1s
    lb_policy: CLUSTER_PROVIDED
    cluster_type:
      name: envoy.clusters.aggregate
      typed_config:
        "@type": type.googleapis.com/envoy.extensions.clusters.aggregate.v3.ClusterConfig
        clusters: [pay-1-payments, waker]
  - name: agg-ui-2
    connect_timeout: 1s
    lb_policy: CLUSTER_PROVIDED
    cluster_type:
      name: envoy.clusters.aggregate
      typed_config:
        "@type": type.googleapis.com/envoy.extensions.clusters.aggregate.v3.ClusterConfig
        clusters: [ui-2-frontend, waker]
  - name: agg-slow-3
    connect_timeout: 1s
    lb_policy: CLUSTER_PROVIDED
    cluster_type:
      name: envoy.clusters.aggregate
      typed_config:
        "@type": type.googleapis.com/envoy.extensions.clusters.aggregate.v3.ClusterConfig
        clusters: [slow-3-app, waker]
