# Unit tests, the panel and the release config on every push.
name: ci
on:
  push:
  pull_request:

jobs:
  go:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test -race ./...
        env:
          # Tests that need Docker skip without it. They run on developer machines with
          # Docker Desktop, Colima and OrbStack; Linux hosts are not verified yet.
          DOCKER_HOST: unix:///nonexistent/docker.sock

  proto:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: go tool -modfile=tools/go.mod buf lint
      # gen/ is committed: it must match proto/.
      - run: go tool -modfile=tools/go.mod buf generate && git diff --exit-code -- gen
      # Auth's queries (sqlc) are committed too: they must match the schema and queries.
      - run: go tool -modfile=tools/go.mod sqlc diff -f internal/auth/store/sqlc.yaml

  # Auth against a real PostgreSQL.
  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 2s --health-timeout 5s --health-retries 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: go test -race ./internal/auth/...
        env:
          DEVOPUS_TEST_DATABASE_URL: postgres://postgres:test@127.0.0.1:5432/postgres?sslmode=disable
          DOCKER_HOST: unix:///nonexistent/docker.sock

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      # The binary embeds the committed build: it must match the sources.
      - run: git diff --exit-code -- ../internal/panel/dist

  release-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: check
